plugins {
    id("com.android.library")
    id("org.jetbrains.kotlin.multiplatform")
    id("maven-publish")
    id 'org.jetbrains.kotlin.plugin.serialization' version "$versions_kotlin"
}
apply plugin: "org.jlleitschuh.gradle.ktlint"

group = "ch.dreipol.dreiattest.multiplatform"


kotlin {
    jvmToolchain(17)

    androidTarget {
        compilations.configureEach {
            kotlinOptions {
                jvmTarget = 17
            }
        }
    }

    iosX64() {
        binaries {
            framework()
        }
    }

    iosArm64() {
        binaries {
            framework()
        }
    }

    iosSimulatorArm64() {
        binaries {
            framework()
        }
    }

    android() {
        publishAllLibraryVariants()
    }

    sourceSets {
        commonMain.dependencies {
            implementation("org.jetbrains.kotlinx:kotlinx-coroutines-core:$versions_coroutines")
            implementation("io.ktor:ktor-client-core:$versions_ktor")
            implementation("io.ktor:ktor-client-logging:$versions_ktor")
            api("io.ktor:ktor-serialization-kotlinx-json:$versions_ktor")
            implementation("io.ktor:ktor-client-content-negotiation:$versions_ktor")
            implementation("co.touchlab:kermit:$versions_kermit")
            api("com.russhwolf:multiplatform-settings:$versions_mpf_settings")
            api("com.russhwolf:multiplatform-settings-no-arg:$versions_mpf_settings")
        }

        commonTest.dependencies {
            implementation(kotlin("test"))
            implementation "io.ktor:ktor-client-mock:$versions_ktor"
            implementation("com.russhwolf:multiplatform-settings-test:$versions_mpf_settings")
        }

        androidMain.dependencies {
            implementation "com.google.android.play:integrity:$versions_play_integrity"
            implementation "org.jetbrains.kotlinx:kotlinx-coroutines-play-services:$versions_play_services_coroutines"
            implementation("io.ktor:ktor-client-android:$versions_ktor")
        }

        androidUnitTest.dependencies {
            implementation("org.jetbrains.kotlin:kotlin-test-junit")
        }

        iosMain.dependencies {
            implementation("io.ktor:ktor-client-darwin:$versions_ktor")
        }
    }

    //    TODO: Remove as soon as Android Studio (Iguana) is fixed
    task("testClasses")
}

android {
    compileSdk 34
    defaultConfig {
        minSdkVersion 23
        consumerProguardFiles "consumer-rules.pro"
    }
    sourceSets {
        main {
            manifest.srcFile 'src/androidMain/AndroidManifest.xml'
        }
    }
    buildTypes {
        //This is for MultiplatformSettings
        debug {
            // MPP libraries don't currently get this resolution automatically
            matchingFallbacks = ['release']
        }
        release {
            minifyEnabled false
        }
    }
    namespace 'ch.dreipol.dreiattest.multiplatform'
}


// workaround for https://youtrack.jetbrains.com/issue/KT-27170
configurations {
    compileClasspath
}

ktlint {
    ignoreFailures.set(false)
}

tasks["build"].dependsOn("ktlintFormat")

Properties properties = new Properties()
File localPropertiesFile = new File(rootProject.projectDir.absolutePath + '/local.properties')
if (localPropertiesFile.exists()) {
    properties.load(localPropertiesFile.newDataInputStream())
}

publishing {
    repositories {
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/dreipol/dreiAttest-android")
            credentials {
                username = properties.getProperty("gpr.user") ?: System.getenv("GITHUB_USERNAME") ?: ""
                password = properties.getProperty("gpr.key") ?: System.getenv("GITHUB_TOKEN") ?: ""
            }
        }
    }
}
